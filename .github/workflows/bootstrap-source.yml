name: Publish ThinkTime Pro Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  publish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4

      - name: Reassemble launch-ready source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-*.b64 | base64 --decode > /tmp/thinktime-source.tgz
          tar -tzf /tmp/thinktime-source.tgz >/dev/null
          tar -xzf /tmp/thinktime-source.tgz -C .
          rm -rf .bootstrap
          rm -f .gitkeep
          rm -f .github/workflows/bootstrap-source.yml

      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ThinkTime Pro Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish ThinkTime Pro 1.2.0 launch-ready source'
          git push origin HEAD:main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and production build
        run: npm run check

      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high
