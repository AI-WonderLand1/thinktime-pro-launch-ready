name: Repair ThinkTime Pro Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-publish-v2.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fix DNS lookup array typing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old = """  let addresses: Awaited<ReturnType<typeof lookup>>;\n  try {\n    addresses = await lookup(url.hostname, { all: true, verbatim: true });\n  } catch {\n    throw new Error('Custom AI provider hostname could not be resolved.');\n  }\n\n  if (!Array.isArray(addresses) || addresses.length === 0) {\n    throw new Error('Custom AI provider hostname did not resolve to an address.');\n  }\n"""
          new = """  let addresses: Array<{ address: string; family: number }>;\n  try {\n    addresses = await lookup(url.hostname, { all: true, verbatim: true });\n  } catch {\n    throw new Error('Custom AI provider hostname could not be resolved.');\n  }\n\n  if (addresses.length === 0) {\n    throw new Error('Custom AI provider hostname did not resolve to an address.');\n  }\n"""
          if old not in s:
              raise SystemExit('Expected DNS lookup block was not found; refusing an unsafe blind edit.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ThinkTime Pro CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add server.ts
          git commit -m 'Fix DNS lookup typing in AI endpoint validation'
          git push origin HEAD:main

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and production build
        run: npm run check

      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high
