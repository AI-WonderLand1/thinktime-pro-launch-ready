name: Refresh ThinkTime Pro Lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-publish-v2.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Regenerate lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ThinkTime Pro Lockfile Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
          else
            git commit -m 'Refresh dependency lockfile'
            git push origin HEAD:main
          fi

      - name: Clean install from lockfile
        run: npm ci --no-audit --no-fund

      - name: Type-check and production build
        run: npm run check

      - name: Audit dependencies
        run: npm audit --audit-level=high
